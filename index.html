<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutschlandfunk Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b132b">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .cover-container {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1rem;
      color: #a0aab2;
      margin-bottom: 40px;
    }

    .play-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: #00b4d8;
      color: #000;
      font-size: 2.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 30px rgba(0, 180, 216, 0.4);
      transition: transform 0.1s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .play-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <img id="cover-art" class="cover-image" src="favicon.png" alt="Deutschlandfunk">
  </div>

  <div class="title">Deutschlandfunk</div>
  <div class="subtitle">Live Stream (Opus 24 kbps)</div>

  <button id="play-btn" class="play-btn" onclick="togglePlay()">▶</button>

  <audio id="audio-player" src="https://st01.sslstream.dlf.de/dlf/01/low/opus/stream.opus" preload="none"></audio>

  <script>
    const STREAM_URL = "https://st01.sslstream.dlf.de/dlf/01/low/opus/stream.opus";
    let isPlaying = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playBtn.innerText = "▶";
        isPlaying = false;
      } else {
        // Bei Live-Streams immer neu laden, um direkt im Live-Signal zu sein
        audio.src = STREAM_URL;
        audio.play();
        playBtn.innerText = "⏸";
        isPlaying = true;
      }
    }

    // Android System & Bluetooth Integration
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Deutschlandfunk',
        artist: 'Live Stream',
        album: 'Opus Low (24 kbps)',
        artwork: [{ src: 'favicon.png', sizes: '512x512', type: 'image/png' }]
      });

      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
    }

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }
  </script>
</body>
</html>
