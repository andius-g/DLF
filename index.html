<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutschlandfunk Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b132b">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .cover-container {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0aab2;
      margin-bottom: 24px;
    }

    /* Equalizer Visualizer Animation */
    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      height: 36px;
      margin-bottom: 32px;
    }

    .bar {
      width: 6px;
      height: 8px;
      background-color: #00b4d8;
      border-radius: 4px;
      transition: height 0.3s ease;
    }

    /* Animierte Balken bei Wiedergabe */
    .playing .bar {
      animation: sound-wave 1.2s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.4s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .bar:nth-child(4) { animation-delay: 0.5s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes sound-wave {
      0% { height: 8px; }
      100% { height: 32px; }
    }

    /* Optimierter Play/Pause Button */
    .play-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      background: #00b4d8;
      color: #0b132b;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.3);
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .play-btn.active {
      background: #0096c7;
      box-shadow: 0 6px 28px rgba(0, 180, 216, 0.6);
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
      /* Optischer Ausgleich für das Play-Dreieck */
      margin-left: 2px;
    }

    .play-btn.active .btn-icon {
      margin-left: 0;
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <img id="cover-art" class="cover-image" src="favicon.png" alt="Deutschlandfunk">
  </div>

  <div class="title">Deutschlandfunk</div>
  <div class="subtitle">Live Stream (Opus 24 kbps)</div>

  <!-- Audio Visualizer -->
  <div id="visualizer" class="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Play / Pause Button mit exakten SVG-Icons -->
  <button id="play-btn" class="play-btn" onclick="togglePlay()" aria-label="Wiedergabe">
    <svg id="btn-icon" class="btn-icon" viewBox="0 0 24 24">
      <!-- Play Icon -->
      <path id="icon-path" d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <audio id="audio-player" src="https://st01.sslstream.dlf.de/dlf/01/low/opus/stream.opus" preload="none"></audio>

  <script>
    const STREAM_URL = "https://st01.sslstream.dlf.de/dlf/01/low/opus/stream.opus";
    let isPlaying = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const iconPath = document.getElementById('icon-path');
    const visualizer = document.getElementById('visualizer');

    // SVG Pfade für exakte Ausrichtung
    const PLAY_PATH = "M8 5v14l11-7z";
    const PAUSE_PATH = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        iconPath.setAttribute('d', PLAY_PATH);
        playBtn.classList.remove('active');
        visualizer.classList.remove('playing');
        isPlaying = false;
      } else {
        audio.src = STREAM_URL;
        audio.play();
        iconPath.setAttribute('d', PAUSE_PATH);
        playBtn.classList.add('active');
        visualizer.classList.add('playing');
        isPlaying = true;
      }
    }

    // Android System & Bluetooth Integration
    if ('mediaSession' in navigator) {
      const iconUrl = new URL('favicon.png', window.location.href).href;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Deutschlandfunk',
        artist: 'Live Stream',
        album: 'Opus Low (24 kbps)',
        artwork: [
          { src: iconUrl, sizes: '96x96', type: 'image/png' },
          { src: iconUrl, sizes: '128x128', type: 'image/png' },
          { src: iconUrl, sizes: '192x192', type: 'image/png' },
          { src: iconUrl, sizes: '256x256', type: 'image/png' },
          { src: iconUrl, sizes: '384x384', type: 'image/png' },
          { src: iconUrl, sizes: '512x512', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
    }

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }
  </script>
</body>
</html>
