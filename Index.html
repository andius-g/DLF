<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutschlandfunk Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002b49">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent: #00b4d8;
      --text: #ffffff;
      --text-dim: #a0aab2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .channel-select {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 20px;
    }

    .channel-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-btn.active {
      background: var(--accent);
      color: #000;
    }

    .cover-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .info-box {
      width: 100%;
      margin-bottom: 20px;
      min-height: 70px;
    }

    .show-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .show-subtitle {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.4);
      transition: transform 0.1s ease;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .quality-select {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .quality-select select {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="channel-select">
      <button class="channel-btn active" onclick="switchChannel('dlf')">DLF</button>
      <button class="channel-btn" onclick="switchChannel('dlfkultur')">Kultur</button>
      <button class="channel-btn" onclick="switchChannel('dlfnova')">Nova</button>
    </div>

    <div class="cover-container">
      <img id="cover-art" class="cover-image" src="favicon.png" alt="Sendungsbild">
    </div>

    <div class="info-box">
      <div id="show-title" class="show-title">Deutschlandfunk Player</div>
      <div id="show-subtitle" class="show-subtitle">Lade Programminformationen...</div>
    </div>

    <div class="controls">
      <button id="play-btn" class="play-btn" onclick="togglePlay()">▶</button>
    </div>

    <div class="quality-select">
      <label for="quality">Format:</label>
      <select id="quality" onchange="changeQuality()">
        <option value="opus-high">Opus High (64 kbps)</option>
        <option value="opus-low">Opus Low (24 kbps)</option>
        <option value="mp3">MP3 (128 kbps)</option>
      </select>
    </div>
  </div>

  <audio id="audio-player" preload="none"></audio>

  <script>
    const STREAMS = {
      dlf: {
        name: "Deutschlandfunk",
        api: "dlf",
        "opus-high": "https://st01.sslstream.dlf.de/dlf/01/high/opus/stream.opus",
        "opus-low": "https://st01.sslstream.dlf.de/dlf/01/low/opus/stream.opus",
        "mp3": "https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3"
      },
      dlfkultur: {
        name: "Dlf Kultur",
        api: "dkultur",
        "opus-high": "https://st01.sslstream.dlf.de/dlf/02/high/opus/stream.opus",
        "opus-low": "https://st01.sslstream.dlf.de/dlf/02/low/opus/stream.opus",
        "mp3": "https://st01.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3"
      },
      dlfnova: {
        name: "Dlf Nova",
        api: "dradiowissen",
        "opus-high": "https://st01.sslstream.dlf.de/dlf/03/high/opus/stream.opus",
        "opus-low": "https://st01.sslstream.dlf.de/dlf/03/low/opus/stream.opus",
        "mp3": "https://st01.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3"
      }
    };

    let currentChannel = 'dlf';
    let currentQuality = 'opus-high';
    let isPlaying = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const titleEl = document.getElementById('show-title');
    const subtitleEl = document.getElementById('show-subtitle');
    const coverEl = document.getElementById('cover-art');

    function init() {
      updateStreamSource();
      fetchProgramInfo();
      setInterval(fetchProgramInfo, 60000);
    }

    function updateStreamSource() {
      const wasPlaying = isPlaying;
      audio.src = STREAMS[currentChannel][currentQuality];
      if (wasPlaying) {
        audio.play();
      }
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playBtn.innerText = "▶";
        isPlaying = false;
      } else {
        audio.play();
        playBtn.innerText = "⏸";
        isPlaying = true;
      }
    }

    function switchChannel(channel) {
      currentChannel = channel;
      document.querySelectorAll('.channel-btn').forEach((btn, index) => {
        btn.classList.toggle('active', Object.keys(STREAMS)[index] === channel);
      });
      updateStreamSource();
      fetchProgramInfo();
    }

    function changeQuality() {
      currentQuality = document.getElementById('quality').value;
      updateStreamSource();
    }

    async function fetchProgramInfo() {
      const channelApi = STREAMS[currentChannel].api;
      try {
        const res = await fetch(`https://www.deutschlandfunk.de/api/nightingale/v1/broadcasts/${channelApi}/today`);
        const data = await res.json();
        
        const now = new Date();
        const currentBroadcast = data.broadcasts?.find(b => {
          const start = new Date(b.startTime);
          const end = new Date(b.endTime);
          return now >= start && now <= end;
        });

        if (currentBroadcast) {
          const title = currentBroadcast.title || STREAMS[currentChannel].name;
          const subtitle = currentBroadcast.subtitle || "Live-Radio";
          const imageUrl = currentBroadcast.image?.url || "favicon.png";

          titleEl.innerText = title;
          subtitleEl.innerText = subtitle;
          coverEl.src = imageUrl;

          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: title,
              artist: STREAMS[currentChannel].name,
              album: subtitle,
              artwork: [{ src: imageUrl, sizes: '512x512', type: 'image/jpeg' }]
            });

            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
          }
        }
      } catch (err) {
        console.error("API-Fehler:", err);
        titleEl.innerText = STREAMS[currentChannel].name;
        subtitleEl.innerText = "Live Stream";
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.log('SW registriert:', reg.scope))
          .catch(err => console.error('SW Fehler:', err));
      });
    }

    init();
  </script>
</body>
</html>
